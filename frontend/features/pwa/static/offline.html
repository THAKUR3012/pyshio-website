<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0284c7" />
  <title>Offline – Pyshio</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 380px; margin: 16px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px;
           text-align: center; }
    img { width: 64px; height: 64px; }
    p { color: #475569; line-height: 1.5; }
    button { background: #0284c7; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600;
             font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/features/pwa/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Pyshio needs an internet connection to show your appointments, medicines and reports. Check your connection and try again.</p>
    <p>In an emergency call <strong>112</strong>.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
